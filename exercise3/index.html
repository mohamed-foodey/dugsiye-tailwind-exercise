<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>grid layout</title>
</head>
<body>
    <div class="grid grid-cols-3 grid-rows-2 gap-4 p-4">
        <div class="bg-blue-500 p-4 text-white row-span-2 col-span-2 ">Featured image (spans 2x2)</div>
        <div class="bg-green-500 p-4 text-white rounded-xl">image 2</div>
        <div class="bg-green-500 p-4 text-white rounded-xl">image 3</div>
        <div class="bg-violet-500 p-4 text-white rounded-xl">image 4</div>
        <div class="bg-violet-500 p-4 text-white rounded-xl">image 5</div>
        <div class="bg-violet-500 p-4 text-white rounded-xl">image 6</div>
    </div>
    
</body>
</html>
