<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>
<body>
    <div class="grid grid-cols-3 gap-4 p-4 text-white w-full">
        <div class="bg-blue-500 col-span-3 p-4 rounded-xl ">
            <h1>featured content</h1>
            <p>this spans across all three columns</p>
        </div>
        <div class="bg-green-500 col-span-2 p-4 rounded-xl ">
            <h1>left section </h1>
            <p>Takes up 2 columns</p>
        </div>
        <div class="bg-green-500 p-4 col-span-1 rounded-xl">
            <h1>right section</h1>
            <p>Takes 1 column</p>
        </div>
        <div class="bg-violet-400 p-4 rounded-xl">
            <h1>column 1</h1>
            <p>Equal width</p>
        </div>
        <div class="bg-violet-400 p-4 rounded-xl">
            <h1>column 2</h1>
            <p>Equal width</p>
        </div>
        <div class="bg-violet-400 p-4 rounded-xl">
            <h1>column 3</h1>
            <p>Equal width</p>
        </div>
    </div>
    
</body>
</html>
